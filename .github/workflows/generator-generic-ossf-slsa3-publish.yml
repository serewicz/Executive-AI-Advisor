name: SLSA provenance

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: executive-ai-advisor
  IMAGE_TAR: executive-ai-advisor-image.tar
  IMAGE_ARTIFACT_NAME: executive-ai-advisor-image
  PROVENANCE_ARTIFACT_NAME: executive-ai-advisor-slsa-provenance
  GITHUB_ATTESTATION_ARTIFACT_NAME: executive-ai-advisor-github-attestations

jobs:
  build:
    name: Build Docker service artifact
    runs-on: ubuntu-latest
    outputs:
      base64-subjects: ${{ steps.hash.outputs.base64-subjects }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Export Docker image artifact
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" --output "${IMAGE_TAR}"

      - name: Generate SLSA provenance subject
        id: hash
        run: |
          set -euo pipefail
          echo "base64-subjects=$(sha256sum "${IMAGE_TAR}" | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: ${{ env.IMAGE_TAR }}
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Generate SLSA L3 provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: ./.github/workflows/reusable-slsa-provenance.yml
    with:
      base64-subjects: ${{ needs.build.outputs.base64-subjects }}
      upload-assets: ${{ github.event_name == 'release' }}
      provenance-name: executive-ai-advisor-image.intoto.jsonl
      private-repository: ${{ github.event.repository.private }}

  github-attestation:
    name: Create GitHub artifact attestation
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}

      - name: Create GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.IMAGE_TAR }}

      - name: Collect GitHub attestation files
        run: |
          set -euo pipefail
          mkdir -p github-attestations
          while IFS= read -r attestation_path; do
            cp "${attestation_path}" github-attestations/
          done < "${RUNNER_TEMP}/created_attestation_paths.txt"

      - name: Upload GitHub attestation artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GITHUB_ATTESTATION_ARTIFACT_NAME }}
          path: github-attestations/*
          if-no-files-found: error
          retention-days: 90

  provenance-artifact:
    name: Persist provenance artifact
    needs: [provenance]
    runs-on: ubuntu-latest
    steps:
      - name: Download generated provenance
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROVENANCE_ARTIFACT_NAME }}
          path: provenance/*.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

  release-assets:
    name: Attach build artifact to release
    needs: [build, provenance, github-attestation]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}

      - name: Attach Docker image to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${IMAGE_TAR}" --clobber
