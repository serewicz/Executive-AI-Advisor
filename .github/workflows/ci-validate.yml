name: ci-validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-validate:
    name: ci-validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: executive_ai
          POSTGRES_PASSWORD: change_me_in_local_development
          POSTGRES_DB: executive_ai_advisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U executive_ai -d executive_ai_advisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://executive_ai:change_me_in_local_development@localhost:5432/executive_ai_advisor
      EMBEDDING_PROVIDER: local
      LLM_PROVIDER: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Run secret scan
        run: python scripts/check_no_secrets.py

      - name: Validate Alembic migrations
        run: alembic upgrade head
